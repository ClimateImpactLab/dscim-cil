name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      # The run extra is needed here because ty resolves imports:
      # runner.py, scc.py, and the integration tests import dscim and
      # its stack, and ty should check them against the environment the
      # code actually runs in.
      - run: uv sync --locked --group tests --extra run
      - run: uv run ruff check src tests --output-format=github
      - run: uv run ruff format --check src tests
      - run: uv run ty check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      # No run extra: the unit tests must pass without dscim installed.
      - run: uv sync --locked --group tests
      - run: >
          uv run pytest -m "not integration" -v --color=yes
          --cov dscim_cil --cov-branch --cov-report term-missing
          --cov-report xml tests
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - run: uv build
      # Install the wheel into a bare environment and run a data-free
      # command, so packaging breakage is caught without the test suite.
      - run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/dscim-cil stages

  integration:
    runs-on: ubuntu-latest
    # Installs dscim from a git commit with its full dependency stack;
    # allowed to fail without blocking merges until the pin has CI
    # history behind it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - run: uv sync --locked --group tests --extra run
      - run: >
          uv run pytest -v --color=yes
          --cov dscim_cil --cov-branch --cov-report term-missing
          --cov-report xml tests
      # pytest-cov writes coverage.xml even when tests fail, so upload
      # unless the job was cancelled; only a crash before pytest finishes
      # loses this job's coverage, leaving the unit flag as the floor.
      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
